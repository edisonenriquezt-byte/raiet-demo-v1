name: Preparar sitio RAIET DEMO para Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "activar.html"
      - "acceso-esabas.js"
      - "manifest.json"
      - "sw.js"
      - "icon-demo.svg"
      - "raiet-*.js"
      - "mejoras.js"
      - "edicion-financiera.js"
      - "scripts/preparar_web_demo.sh"
      - ".github/workflows/raiet-demo-web-check.yml"

permissions:
  contents: read

jobs:
  preparar-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Construir sitio web independiente
        run: sh scripts/preparar_web_demo.sh
      - name: Verificar archivos y aislamiento
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/activar.html
          test -f dist/sw.js
          test -f dist/manifest.json
          test -f dist/_headers
          test -s dist/icon-192.png
          test -s dist/icon-512.png
          for archivo in acceso-esabas.js mejoras.js edicion-financiera.js raiet-interacciones.js raiet-respaldo.js raiet-gestion.js raiet-inventario.js raiet-historia-clinica.js raiet-native.js; do
            test -s "dist/$archivo"
          done
          grep -q 'lhqyibxpstrterlckaax' dist/index.html
          WEB_VERSION="$(grep -oE 'const VERSION_WEB = "[0-9.]+"' dist/acceso-esabas.js | cut -d '"' -f 2)"
          test -n "$WEB_VERSION"
          echo "WEB_VERSION=$WEB_VERSION" >> "$GITHUB_ENV"
          grep -q 'RAIET DEMO PRO' dist/index.html
          grep -q 'Crea una copia de seguridad protegida por contraseña' dist/raiet-respaldo.js
          if grep -rq 'fwkdtcecdwxezzkphxiv' dist; then
            echo "Error: una referencia al proyecto privado ESABAS apareció en DEMO." >&2
            exit 1
          fi
          echo "Paquete DEMO validado: origen Cloudflare independiente, Web v${WEB_VERSION}."
      - name: Empaquetar para carga directa opcional
        shell: bash
        run: |
          (cd dist && zip -q -r "../RAIET-DEMO-WEB-v${WEB_VERSION}.zip" .)
      - name: Guardar sitio listo para Cloudflare Pages
        uses: actions/upload-artifact@v4
        with:
          name: RAIET-DEMO-WEB-${{ env.WEB_VERSION }}-Cloudflare
          path: RAIET-DEMO-WEB-v*.zip
          if-no-files-found: error
          retention-days: 30
